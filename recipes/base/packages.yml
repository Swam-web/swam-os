---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Fichier inclus via `from-file:` -> doit être un OBJET { modules: [...] },
# pas une liste nue (schéma module-list-v1.json).
modules:
  # Addons CachyOS. scx-scheds / scx-tools sont déjà fournis par la base Bazzite.
  # cachyos-settings fournit son propre zram-generator-defaults, en conflit avec
  # celui de la base -> --allowerasing (d'où le snippet dnf5 plutôt que le module dnf).
  - type: script
    snippets:
      - dnf5 -y install --allowerasing cachyos-settings scx-manager ananicy-cpp cachyos-ananicy-rules

  # Impression, scan, découverte et firewall (no-op si déjà dans la base)
  - type: dnf
    install:
      packages:
        - firewalld
        - firewall-config
        - firewall-applet
        - hplip
        - cups
        - avahi
        - tmux

  # Services (no-op si déjà activés par la base)
  - type: systemd
    system:
      enabled:
        - cups.service
        - avahi-daemon.service
        - avahi-daemon.socket
        - firewalld.service
        - podman.socket
