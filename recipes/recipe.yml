---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: swam-os-kinoite-amd
description: Kinoite-based custom image with CachyOS kernel and AMD ROCm
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44
platforms:
  - linux/amd64
modules:
  # Copie de system_files -> / (équivalent du cp -avf du build.sh d'origine)
  - type: files
    files:
      - source: system
        destination: /

  # Kernel CachyOS clang-LTO remplaçant le kernel Fedora
  # (shims kernel-install, rpm --erase --nodeps, versionlock)
  - type: script
    scripts:
      - kernel-cachyos.sh

  # AMD ROCm : depot officiel AMD + pile userland
  # (inclut le correctif /opt, sans lequel les RPM rocm-* ne s'installent pas)
  - type: script
    scripts:
      - rocm.sh

  # Addons CachyOS, paquets système, services
  - from-file: base/packages.yml

  # Nettoyage : toolchain de build, repos et COPRs désactivés
  - type: script
    scripts:
      - cleanup.sh

  # Initramfs : régénéré pour le kernel CachyOS installé
  # (équivaut au « dracut --kver … --add ostree --add fido2 » du build.sh)
  - type: initramfs

  # Politiques de signature cosign (rpm-ostree + bootc) — requis par la CI
  - type: signing

# Caveats (identiques à la version d'origine) :
# - Secure Boot : le kernel CachyOS et les modules ne sont pas signés
#   avec une clé Microsoft-trustée. Désactiver Secure Boot ou enroll MOK.
# - Le kernel CachyOS est clang/LTO : tout kmod tiers devrait être compilé
#   pour cette ABI exacte (cette variante n'en embarque aucun).
